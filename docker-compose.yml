version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceback-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-traceback_db}
      POSTGRES_USER: ${DB_USER:-traceback_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-traceback_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traceback_user} -d ${DB_NAME:-traceback_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
