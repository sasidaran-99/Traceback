server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: traceback-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traceback_db}
    username: ${DB_USER:traceback_user}
    password: ${DB_PASSWORD:traceback_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.traceback: DEBUG

# AI Gateway and Technical Research configuration (Phase 2.39)
traceback:
  bifrost:
    base-url: ${BIFROST_BASE_URL:http://localhost:8181/v1}
    api-key: ${BIFROST_API_KEY:}
    model: ${BIFROST_MODEL:gemini-3.8-flash}
    timeout-seconds: ${BIFROST_TIMEOUT_SECONDS:180}
    max-retries: ${BIFROST_MAX_RETRIES:2}
  tavily:
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    api-key: ${TAVILY_API_KEY:}
    max-searches: ${TAVILY_MAX_SEARCHES:3}
    timeout-seconds: ${TAVILY_TIMEOUT_SECONDS:10}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    allowed-repo-roots: ${TRACEBACK_ALLOWED_REPO_ROOTS:}
  git:
    lock-directory: ${TRACEBACK_GIT_LOCK_DIRECTORY:}

---
# Development profile: defaults server network binding to loopback (127.0.0.1).
# Can be overridden by setting SERVER_ADDRESS environment variable or server.address property.
spring:
  config:
    activate:
      on-profile: dev
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

---
# Local profile: defaults server network binding to loopback (127.0.0.1).
# Can be overridden by setting SERVER_ADDRESS environment variable or server.address property.
spring:
  config:
    activate:
      on-profile: local
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
