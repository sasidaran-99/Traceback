server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: traceback-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traceback_db}
    username: ${DB_USER:traceback_user}
    password: ${DB_PASSWORD:traceback_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.traceback: DEBUG

# AI Gateway and Technical Research configuration (Phase 4)
traceback:
  bifrost:
    base-url: ${BIFROST_BASE_URL:http://localhost:8080/v1}
    api-key: ${BIFROST_API_KEY:}
    model: ${BIFROST_MODEL:gpt-4o}
    timeout-seconds: ${BIFROST_TIMEOUT_SECONDS:15}
    max-retries: ${BIFROST_MAX_RETRIES:2}
  tavily:
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    api-key: ${TAVILY_API_KEY:}
    max-searches: ${TAVILY_MAX_SEARCHES:3}
    timeout-seconds: ${TAVILY_TIMEOUT_SECONDS:10}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
  security:
    allowed-repo-roots: ${TRACEBACK_ALLOWED_REPO_ROOTS:}
