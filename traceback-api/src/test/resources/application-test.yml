spring:
  application:
    name: traceback-api-test

  datasource:
    url: jdbc:h2:mem:traceback_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.traceback: DEBUG
    org.flywaydb: INFO

traceback:
  security:
    jwt:
      issuer: https://auth.traceback.test
      audience: traceback-api

