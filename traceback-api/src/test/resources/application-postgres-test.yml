spring:
  application:
    name: traceback-postgres-test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traceback_db}
    username: ${DB_USER:traceback_user}
    password: ${DB_PASSWORD:traceback_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

traceback:
  bifrost:
    base-url: http://localhost:8080/v1
    api-key: test-key
    model: test-model
  tavily:
    base-url: http://localhost:8080/v1
    api-key: test-key
  cors:
    allowed-origin-patterns: http://localhost:[*]
  security:
    allowed-repo-roots: ""

logging:
  level:
    root: INFO
    com.traceback: DEBUG
    org.flywaydb: INFO
